<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Chat-Backtest">
  <!-- Brand mark: the accent tick that opens every eyebrow label in the design
       system, beside a rising step curve — a backtest equity line, not a
       generic chart. Dark tile so it reads on both light and dark browser
       chrome. Colours mirror styles/tokens.css (--bg-0, --accent, --ink). -->
  <rect width="64" height="64" rx="14" fill="#0c0f14"/>
  <rect x="12" y="16" width="4" height="32" rx="2" fill="#4da2ff"/>
  <path d="M24 42 L32 42 L32 34 L40 34 L40 26 L50 26"
        fill="none" stroke="#e9edf4" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="26" r="4" fill="#4da2ff"/>
</svg>
